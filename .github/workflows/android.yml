# .github/workflows/render.yml
name: Render Motion Graphics Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install FFmpeg & Emoji Fonts
      run: |
        sudo apt-get update
        # Install FFmpeg untuk encoding video dan font emoji agar ikon tampil berwarna di headless Chrome
        sudo apt-get install -y ffmpeg fonts-noto-color-emoji
      
    - name: Install Node Dependencies
      # Puppeteer akan otomatis mengunduh binary Chromium yang kompatibel
      run: npm install puppeteer
      
    - name: Install Chromium OS Dependencies (Auto-Detect)
      # Solusi robust: Biarkan Puppeteer mendeteksi OS dan menginstal dependensi sistem yang benar.
      # Ini menghindari error incompatibilitas paket manual seperti libasound2 vs libasound2t64.
      run: npx puppeteer install-deps
      
    - name: Run Video Renderer
      run: node render.js
      
    - name: Upload MP4 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: part-01-enkripsi-video
        path: output/part-01-apa-itu-enkripsi.mp4
        retention-days: 7
